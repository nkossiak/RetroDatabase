<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retro Collection</title>

    <!-- Bootstrap: only for table/button utility if needed -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <img src="images/controller.gif" alt="icon" class="header-icon">
    <h1>Retro Collection</h1>
    <p>NES & SNES Library</p>
    
    <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    </nav>
</header>

<section class="form-section">
    <h2>Add Game</h2>
    <form id="gameForm">
        <input type="text" id="title" placeholder="Game Title" required>

        <select id="console">
            <option value="NES">NES</option>
            <option value="SNES">SNES</option>
        </select>

        <input type="number" id="year" placeholder="Release Year">

        <label class="checkbox-label">
            <input type="checkbox" id="completed">
            Completed
        </label>

        <button type="submit">+</button>
    </form>
</section>

<section class="collection">
    <h2>Your Collection</h2>

    <div class="table-wrapper">
        <table class="table retro-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Console</th>
                    <th>Year</th>
                    <th>Completed</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="gameTableBody">
            </tbody>
        </table>
    </div>

    <div id="gameList"></div>
</section>

<script src="script.js"></script>
</body>
</html>
